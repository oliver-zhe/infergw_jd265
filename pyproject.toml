[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oliver-zhe-infergw_jd265"
version = "0.1.0"
description = "按结构键把条目聚类，标出推理网关架构师·GPU 故障与作业自愈上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "oliver-zhe" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://oliver-zhe.github.io"
Repository = "https://github.com/oliver-zhe/infergw_jd265"
Issues = "https://github.com/oliver-zhe/infergw_jd265/issues"

[project.scripts]
infergw_jd265 = "infergw_jd265:main"

[tool.setuptools]
py-modules = ["infergw_jd265"]
